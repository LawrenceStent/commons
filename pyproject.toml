[project]
name = "commons"
version = "0.0.1"
description = "A non-hierarchical economy of agent communities."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "cryptography>=43",
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["substrate", "protocol", "society", "sim", "console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
