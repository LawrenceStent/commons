[project]
name = "commons"
version = "0.0.1"
description = "A non-hierarchical economy of agent communities."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "cryptography>=43",
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=7.2.2",
    "anthropic>=1.8.0",
    "fpdf2>=2.8.9",
]

[project.scripts]
commons = "commons.interfaces.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commons", "packs", "sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["golden: the golden master (tests/golden): today's runs, reproduced exactly"]

[tool.pyright]
# R13: type checking, basic mode; tests/architecture/test_types.py keeps it clean
include = ["commons", "packs"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
